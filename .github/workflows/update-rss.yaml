name: Update RSS Feeds

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  update-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v3

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Fetch RSS feeds and update JSON
        run: |
          # Fetch existing data
          if [ -f data.json ]; then
            cp data.json old_data.json
          else
            echo "{\"lastUpdate\": \"\", \"projects\": []}" > old_data.json
          fi

          echo "{\"lastUpdate\": \"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\", \"projects\": []}" > new_data.json

          FEEDS=(
            "https://feeds.feedburner.com/awwwards-sites-of-the-day"
            "https://feeds.feedburner.com/awwwards-nominations"
          )

          for FEED in "${FEEDS[@]}"; do
            echo "Fetching: $FEED"
            RSS=$(curl -s "$FEED")
            if [ -z "$RSS" ]; then
              echo "Failed to fetch RSS feed from $FEED"
              continue
            fi

            ITEMS=$(echo "$RSS" | grep -oP '(?<=<item>).*?(?=</item>)' | head -15) # Adjust to capture more items if possible

            echo "$ITEMS" | while read -r ITEM; do
              TITLE=$(echo "$ITEM" | grep -oP '(?<=<title>).*?(?=</title>)' | sed 's/"/\\"/g')
              LINK=$(echo "$ITEM" | grep -oP '(?<=<link>).*?(?=</link>)' | sed 's/"/\\"/g')
              IMAGE=$(echo "$ITEM" | grep -oP "(?<=<img src=')[^']+" | head -1)
              IMAGE=${IMAGE:-"null"}

              # Construct a new project entry
              NEW_PROJECT="{\"title\": \"$TITLE\", \"link\": \"$LINK\", \"image\": \"$IMAGE\"}"

              # Check for duplicates
              if ! jq -e ".projects[] | select(.link == \"$LINK\")" old_data.json > /dev/null; then
                echo "$NEW_PROJECT," >> new_data.json
              fi
            done
          done

          # Finalize new data
          echo "]}" >> new_data.json
          jq -s '.[0].projects += .[1].projects | .[0]' old_data.json new_data.json > data.json
          jq '.projects |= unique_by(.link)' data.json > temp.json && mv temp.json data.json

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add data.json
          git commit -m "Updated JSON via RSS feeds" || echo "No changes to commit"
          git push
