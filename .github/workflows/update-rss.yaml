name: Update RSS Feeds

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

jobs:
  update-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v3

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Fetch RSS feeds and generate JSON
        run: |
          # Initialize JSON file
          echo "{\"lastUpdate\": \"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\", \"projects\": [" > data.json

          FEEDS=(
            "https://feeds.feedburner.com/awwwards-sites-of-the-day"
            "https://feeds.feedburner.com/awwwards-nominations"
          )

          FIRST=true
          for FEED in "${FEEDS[@]}"; do
            echo "Fetching: $FEED"
            RSS=$(curl -s "$FEED")

            if [ -z "$RSS" ]; then
              echo "Failed to fetch RSS feed from $FEED"
              continue
            fi

            # Extract items, expecting up to 6
            ITEMS=$(echo "$RSS" | grep -oP '(?<=<item>).*?(?=</item>)' | head -15)

            if [ -z "$ITEMS" ]; then
              echo "No items found in feed $FEED"
              continue
            fi

            while read -r ITEM; do
              if [ "$FIRST" = false ]; then
                echo "," >> data.json
              fi
              FIRST=false
              
              TITLE=$(echo "$ITEM" | grep -oP '(?<=<title>).*?(?=</title>)' | sed 's/"/\\"/g')
              LINK=$(echo "$ITEM" | grep -oP '(?<=<link>).*?(?=</link>)' | sed 's/"/\\"/g')
              IMAGE=$(echo "$ITEM" | grep -oP "(?<=<img src=')[^']+" | head -1)
              IMAGE=${IMAGE:-"null"}

              CREATOR_NAME=$(echo "$ITEM" | grep -oP '(?<=<dc:creator>).*?(?=</dc:creator>)' | sed 's/"/\\"/g')
              CREATOR_NAME=${CREATOR_NAME:-"Unknown"}
              CREATOR_LINK=$(echo "$ITEM" | grep -oP '(?<=<creatorLink>).*?(?=</creatorLink>)' | sed 's/"/\\"/g')
              CREATOR_LINK=${CREATOR_LINK:-"null"}
              CREATOR_AVATAR=$(echo "$ITEM" | grep -oP '(?<=<creatorAvatar>).*?(?=</creatorAvatar>)' | sed 's/"/\\"/g')
              CREATOR_AVATAR=${CREATOR_AVATAR:-"null"}

              # Append this item to JSON
              echo "    {\"title\": \"$TITLE\", \"link\": \"$LINK\", \"image\": \"$IMAGE\", \"creators\": [{\"name\": \"$CREATOR_NAME\", \"link\": \"$CREATOR_LINK\", \"avatar\": \"$CREATOR_AVATAR\"}]}" >> data.json
            done <<< "$ITEMS"
          done

          # Close JSON array and object
          echo "]}" >> data.json

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add data.json
          git commit -m "Updated JSON via RSS feeds" || echo "No changes to commit"
          git push
