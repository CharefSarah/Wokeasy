name: Update RSS Feeds

on:
  schedule:
    - cron: "0 6 * * *" # Runs every day at 6 AM
  workflow_dispatch: # Allows manual triggering

jobs:
  update-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v3

      - name: Fetch RSS feeds and generate JSON
        run: |
          echo "{\"lastUpdate\": \"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\", \"projects\": [" > data.json

          FEEDS=(
            "https://feeds.feedburner.com/awwwards-sites-of-the-day"
            "https://feeds.feedburner.com/awwwards-nominations"
          )

          for FEED in "${FEEDS[@]}"; do
            echo "Fetching: $FEED"
            RSS=$(curl -s "$FEED")

            # Vérifier si le RSS est bien récupéré
            if [ -z "$RSS" ]; then
              echo "Erreur: Impossible de récupérer le flux RSS de $FEED"
              continue
            fi

            # Extraire les items (1 site of the day + 5 nominees)
            ITEMS=$(echo "$RSS" | grep -oP '(?<=<item>).*?(?=</item>)' | head -6)

            # Vérifier si des items sont récupérés
            if [ -z "$ITEMS" ]; then
              echo "Erreur: Aucun élément <item> trouvé dans $FEED"
              continue
            fi

            while read -r ITEM; do
              TITLE=$(echo "$ITEM" | grep -oP '(?<=<title>).*?(?=</title>)' | sed 's/"/\\"/g')
              LINK=$(echo "$ITEM" | grep -oP '(?<=<link>).*?(?=</link>)' | sed 's/"/\\"/g')

              # Extraction correcte de l'image
              IMAGE=$(echo "$ITEM" | grep -oP "(?<=<img src=')[^']+" | head -1)
              IMAGE=${IMAGE:-"null"}

              # Vérifier si l'image est bien extraite
              echo "Extracted image: $IMAGE"

              # Extraire le créateur
              CREATOR_NAME=$(echo "$ITEM" | grep -oP '(?<=<dc:creator>).*?(?=</dc:creator>)' | sed 's/"/\\"/g')
              CREATOR_NAME=${CREATOR_NAME:-"Unknown"}
              CREATOR_LINK=$(echo "$ITEM" | grep -oP '(?<=<creatorLink>).*?(?=</creatorLink>)' | sed 's/"/\\"/g')
              CREATOR_LINK=${CREATOR_LINK:-"null"}
              CREATOR_AVATAR=$(echo "$ITEM" | grep -oP '(?<=<creatorAvatar>).*?(?=</creatorAvatar>)' | sed 's/"/\\"/g')
              CREATOR_AVATAR=${CREATOR_AVATAR:-"null"}

              # Ajout dans le JSON
              echo "    {\"title\": \"$TITLE\", \"link\": \"$LINK\", \"category\": \"null\", \"colors\": [], \"styles\": [], \"logo\": \"null\", \"image\": \"$IMAGE\", \"video\": \"null\", \"creators\": [{ \"name\": \"$CREATOR_NAME\", \"link\": \"$CREATOR_LINK\", \"avatar\": \"$CREATOR_AVATAR\" }]}," >> data.json
            done <<< "$ITEMS"
          done

          # Supprimer la virgule finale et fermer le JSON
          sed -i '$ s/,$//' data.json
          echo "]}" >> data.json

          # Afficher le JSON généré pour vérification
          cat data.json

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add data.json
          git commit -m "Mise à jour automatique du flux RSS avec créateurs et images" || echo "Aucune modification"
          git pull --rebase https://x-access-token:${{ secrets.GH_PAT }}@github.com/CharefSarah/Wokeasy.git
          git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/CharefSarah/Wokeasy.git
